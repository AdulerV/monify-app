spring.application.name=monify_api

# MySQL: o banco "monify" e criado automaticamente se nao existir
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/monify?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# expiracao do token em dias
security.jwt.expiracao=30
# chave HMAC em Base64 (minimo 256 bits). Em producao, defina a variavel de ambiente JWT_SECRET.
security.jwt.chave-assinatura=${JWT_SECRET:td52a/+lmRU2negMJX1T0IJrGhhwT/Z7e2UDaNvxK35VhistheeKckqs5OslJ0CSNygkmPJRxwqXoIRlfq7i/A==}

springdoc.swagger-ui.path=/swagger-ui.html

# origens do front-end autorizadas (separadas por virgula)
app.cors.origens=${CORS_ORIGENS:http://localhost:3000}
